[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nikon-recipes-to-lr-profiles"
version = "0.2.0"
description = "Calibrate Nikon Imaging Recipes into adjustable Lightroom / Camera Raw profiles"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "b-z"}]
dependencies = ["numpy>=1.23", "scipy>=1.12", "tifffile>=2023.7.10", "Pillow>=10"]

[project.scripts]
nikon-recipes-lr = "nikon_recipes_lr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
