name: Idea or new camera
description: Suggest an improvement, a new camera calibration or other contribution
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to change or add?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why is it useful?
  - type: checkboxes
    id: help
    attributes:
      label: Contribution
      options:
        - label: I can help implement or test this (for a new camera, I can render charts with it).
